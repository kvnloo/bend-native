name: bend
version: 0.3.2
description: "Native Bend proof verification with captured inputs and explicit evidence scope."
author: kvnloo
kind: standalone
platforms:
  - linux
  - macos
provides_tools:
  - bend_verify
provides_commands:
  - bend
config_schema:
  executable:
    type: str
    default: bend
    label: Bend executable
    description: Installed Bend command or absolute binary path on the Hermes host.
  dependency_cache:
    type: str
    default: ""
    label: Bend dependency cache
    description: Existing Bend Hub cache directory. Empty uses the host user's .bend/lib. No downloads are performed.
